<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 50%;
            margin-top: 12px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        input {
            padding: 8px;
            margin-right: 8px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0; }
        input[type=number] { 
            -moz-appearance: textfield; 
        }
        h1 { 
            text-align: center; 
        }
        h2 { 
            margin-top: 24px; 
        }
    </style>
</head>
<body>
    <h1>Movie Collection</h1>
    <h2>Add Movie</h2>
    <div class="form-row">
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="genre" placeholder="Genre" />
        <input type="number" id="year" placeholder="Year" />
        <button onclick="addMovie()">Add Movie</button>
    </div>
    <p id="message"></p>
    <h2>Movies</h2>
    <button onclick="loadMovies()">Load Movies</button>

    <table id="movies-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="movies-body"></tbody>
    </table>


    <script>
        async function loadMovies() {
            const res = await fetch('/api/movies')
            const movies = await res.json()
            const tbody = document.getElementById('movies-body')
            tbody.innerHTML = movies.map(m =>
                `<tr><td>${m.id}</td><td>${m.title}</td><td>${m.genre}</td><td>${m.year}</td></tr>`
            ).join('')
        }

        async function addMovie() {
            const title = document.getElementById('title').value
            const genre = document.getElementById('genre').value
            const year = Number(document.getElementById('year').value)

            const res = await fetch('/api/movies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, genre, year })
            })

            const data = await res.json()
            document.getElementById('message').innerHTML = `<strong>${data.message}</strong>`
            loadMovies()
        }

        loadMovies()
    </script>
</body>
</html>
