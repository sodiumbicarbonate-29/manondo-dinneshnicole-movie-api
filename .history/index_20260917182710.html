<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <style>
        .form-row { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <h1>Movie Collection</h1>
    <h2>Add Movie</h2>
    <div class="form-row">
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="genre" placeholder="Genre" />
        <input type="number" id="year" placeholder="Year" />
        <button onclick="addMovie()">Add Movie</button>
    </div>
    <p id="message"></p>
    <br>
    <h2>Movies</h2>

    <table id="movies-table" border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="movies-body"></tbody>
    </table>


    <script>
        async function loadMovies() {
            const res = await fetch('/api/movies')
            const movies = await res.json()
            const tbody = document.getElementById('movies-body')
            tbody.innerHTML = movies.map(m =>
                `<tr><td>${m.id}</td><td>${m.title}</td><td>${m.genre}</td><td>${m.year}</td></tr>`
            ).join('')
        }

        async function addMovie() {
            const title = document.getElementById('title').value
            const genre = document.getElementById('genre').value
            const year = Number(document.getElementById('year').value)

            const res = await fetch('/api/movies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, genre, year })
            })

            const data = await res.json()
            document.getElementById('message').textContent = data.message
            loadMovies()
        }

        loadMovies()
    </script>
</body>
</html>
