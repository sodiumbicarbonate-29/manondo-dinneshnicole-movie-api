<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #message { margin-top: 12px; color: green; }
    </style>
</head>
<body>
    <h2>Add Movie</h2>
    <input type="text" id="title" placeholder="Title" />
    <input type="text" id="genre" placeholder="Genre" />
    <input type="number" id="year" placeholder="Year" />
    <button onclick="addMovie()">Add Movie</button>
    <p id="message"></p>

    <script>
        async function addMovie() {
            const title = document.getElementById('title').value
            const genre = document.getElementById('genre').value
            const year = Number(document.getElementById('year').value)

            const res = await fetch('/api/movies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, genre, year })
            })

            const data = await res.json()
            document.getElementById('message').textContent = data.message
        }
    </script>
</body>
</html>
